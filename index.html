          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

        2: true,
        3: true,
        4: true,
        5: true
      });

        localStorage.setItem('bme_course_statuses', JSON.stringify(statuses));
      }, [statuses]);

      // Calculate Total Hours & Stats
      const stats = useMemo(() => {
        let totalCompleted = 0;
        let totalInProgress = 0;

        const catTotals = {
          uni_req: { name: 'جامعة إجباري', total: 16, completed: 0, inProgress: 0 },
          uni_elec: { name: 'جامعة اختياري', total: 9, completed: 0, inProgress: 0 },
          college_req: { name: 'كلية إجباري', total: 32, completed: 0, inProgress: 0 },
          dept_req: { name: 'قسم إجباري', total: 94, completed: 0, inProgress: 0 },
          dept_elec: { name: 'قسم اختياري', total: 9, completed: 0, inProgress: 0 }
        };

        INITIAL_COURSES.forEach(course => {
          const st = statuses[course.id] || 'neutral';
          if (st === 'passed') totalCompleted += course.hours;
          else if (st === 'in_progress') totalInProgress += course.hours;

          let catKey = course.category;
          if (catKey === 'basic_sci' || catKey === 'basic_eng') catKey = 'college_req';

          if (catTotals[catKey]) {
            if (st === 'passed') catTotals[catKey].completed += course.hours;
            else if (st === 'in_progress') catTotals[catKey].inProgress += course.hours;
          }
        });

        return {
          totalCompleted,
          totalInProgress,
          totalHours: 160,
          catTotals
        };

          // If already passed, it is no longer available to register
          if (statuses[course.id] === 'passed') return false;

          // Check credit hours prerequisite (e.g. Training & Grad Project 1 need 117 hours)
          if ((course.id === '284901' || course.id === '285910') && stats.totalCompleted < 117) {
            return false;
          }

          // If no prerequisites, it is available by default
          if (!course.prereqs || course.prereqs.length === 0) return true;

          // Check if all prerequisites are fulfilled
          return course.prereqs.every(pr => {
            const prStatus = statuses[pr.id];
            if (pr.note && (pr.note.includes('سابق دراسة') || pr.note.includes('متزامن'))) {
              return prStatus === 'passed' || prStatus === 'in_progress';
            }
            return prStatus === 'passed';

          if (current === 'in_progress') next = 'passed';
          else if (current === 'passed') next = 'neutral';
          
          return { ...prev, [courseId]: next };

          yearCourses.forEach(c => {
            nextState[c.id] = allCompleted ? 'neutral' : 'passed';
